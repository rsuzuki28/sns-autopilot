# ===== アカウント設定 =====
# ここを書き換えるとAIの台本・投稿スケジュールが変わります。

account:
  name: "マイル旅ナビ"                # 表示名（仮。自由に変更してください）
  niche: "クレジットカード・マイル・ポイ活で旅行をお得にする情報"
  target: "20〜40代の会社員。旅行が好きで、年1〜2回は飛行機に乗る。クレカやマイルは気になっているが詳しくない人"
  persona: |
    陸マイラー歴の長い会社員。難しい用語をかみ砕いて、等身大の目線で話す。
    煽りすぎず、メリットとデメリットを両方伝える誠実なキャラクター。
    一人称は「僕」。語尾はです・ます調で、ときどき砕けた口語を混ぜる。
  # 投稿テーマの比率（合計100）
  themes:
    クレカ比較・選び方: 25
    マイルの貯め方・使い方: 25
    最新キャンペーン・セール速報: 20
    空港ラウンジ・旅行の小ワザ: 15
    ポイ活・ポイント交換ルート: 15

# 承認モード
#   manual : 毎日AIが下書きをPull Requestで作成 → 内容を確認してマージした投稿だけ公開
#   auto   : 確認なしで自動公開（品質が安定してから切り替え推奨）
approval: manual

# Claudeの設定
llm:
  model: claude-opus-5-5
  effort: high          # low / medium / high / xhigh / max
  web_search_max_uses: 8

# 投稿スケジュール（日本時間）
schedule:
  timezone: Asia/Tokyo
  x:
    slots: ["07:30", "12:15", "18:30", "21:30"]   # 1日4投稿
    # X Premium契約中なら true（長文投稿が可能になる）
    premium: false
  instagram:
    # 曜日ごとの投稿形式（mon..sun）。carousel / reel / none
    weekly:
      mon: carousel
      tue: reel
      wed: carousel
      thu: reel
      fri: carousel
      sat: reel
      sun: none
    time: "20:00"

# 広告・コンプライアンス（ステマ規制対応）
compliance:
  pr_label_x: "【PR】"          # アフィリエイトを含む投稿の先頭に付ける
  pr_hashtag_instagram: "#PR"
  # AIに使わせない表現
  ng_words:
    - 絶対に儲かる
    - 必ず儲かる
    - 誰でも審査に通る
    - 審査なし
    - ブラックでも
    - リボ払いがおすすめ
    - 100%
  disclaimer: "※条件・特典は変更される場合があります。最新情報は公式サイトをご確認ください。"

# Instagram画像のデザイン
design:
  brand_color: "#0B3D91"     # メインカラー（濃紺）
  accent_color: "#F5A623"    # アクセント（ゴールド）
  background: "#F7F4EE"      # 背景（オフホワイト）
  text_color: "#1F2328"
  handle: "@your_handle"     # 画像の隅に入れるアカウント名

# Instagram用の画像・動画をどこに置くか（Instagram APIは公開URLが必要）
#   github_raw : このリポジトリ（Public）の raw URL を使う
#   r2         : Cloudflare R2 / S3互換ストレージにアップロード（Privateリポジトリ向け）
media_host: github_raw
