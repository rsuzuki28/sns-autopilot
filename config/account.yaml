# ===== アカウント設定 =====
# ここを書き換えるとAIの台本・投稿スケジュールが変わります。

account:
  name: "R｜クレカ×マイル×旅"            # 表示名（変更OK）
  niche: "クレジットカード・ANAマイル・ホテル系アメックス・空港ラウンジで、旅行をお得に快適にする情報"
  target: "20〜40代の会社員・経営者。旅行が好きで、クレカやマイルをもっと上手に使いたい人。SFCやプレミアムカードに興味がある人"
  persona: |
    R（アール）。首都圏在住、会社経営、投資歴10年以上。
    2024年にSFC修行でANAダイヤモンド達成、2025年もダイヤ継続、2026年は3年目のダイヤ修行中。
    メインカードは SFC ANAダイナースプレミアム、Marriott Bonvoyアメックス・プレミアム、ヒルトン・オナーズ アメックス・プレミアム。
    ビジネスカードは ANAダイナース ビジネスアカウント、アメックスゴールドビジネス。
    趣味は旅行（宮古島が大好き）、筋トレ、ゴルフ。顔出しはしない。
    飛行機はANAにしか乗らない（JALの搭乗体験は書かない。素材の説明に「JAL」とあっても誤判定としてANAとして扱う）。
    修行は国内線プレミアムクラス中心（例: 2026/11/17 羽田→石垣→羽田→那覇→羽田の4区間すべてプレミアムクラス、機内食4回）。
    実績: ANAマイレージクラブ ダイヤモンド会員。
    保有マイル数・ANA SKY コイン数など「自分の残高」は一切書かない（Rさんの方針 2026-11-24。マイルは使うので変動する）。
    文体: 「結論から書きます」型。公式情報を根拠に、数字で淡々と、誇張しない。
    改悪・値上げも隠さず伝え、「使うべき人・待つべき人」をはっきり分ける。
    実体験（SFC修行、ダイヤ修行、ホテルステイ、ラウンジ）を混ぜて信頼感を出す。
  themes:
    クレカ比較・選び方（実際に持っているカード中心）: 25
    ANAマイル・SFC・ダイヤ修行: 25
    最新の改悪・値上げ・キャンペーン速報: 20
    ホテル（マリオット・ヒルトン）と旅行記: 15
    空港ラウンジ・ポイ活・交換ルート: 15

# メインブログ（SNSからの送客先）
blog:
  url: "https://cc-lifeblog.com/"
  # 毎日の台本のうち、ブログ記事への誘導を入れる割合（0〜1）
  promote_ratio: 0.5
  # SNSでは扱わないブログカテゴリ（アカウント凍結・規約リスクのため）
  exclude_keywords: ["現金化", "キャッシング", "カードローン", "消費者金融", "借入", "即日融資", "任意整理", "過払い", "資金調達", "在籍確認", "審査に落ち", "収入証明", "セントラル", "マリオットボンヴォイアメックスプレミアムは本当に得か"]

# 承認モード
#   manual : 毎日AIが下書きをPull Requestで作成 → 内容を確認してマージした投稿だけ公開
#   auto   : 確認なしで自動公開（品質が安定してから切り替え推奨）
approval: manual

# Claudeの設定
llm:
  model: claude-opus-5-5
  effort: high          # low / medium / high / xhigh / max
  web_search_max_uses: 8

# 投稿スケジュール（日本時間）
schedule:
  timezone: Asia/Tokyo
  x:
    slots: ["07:30", "12:15", "18:30", "21:30"]   # 1日4投稿
    # X Premium契約中なら true（長文投稿が可能になる）
    premium: false
    # ブログへの誘導方法
    #   profile : 本文で「詳しくはプロフのリンクから」と案内（URLなし。X APIの料金が安い）
    #   reply   : 返信欄に記事URLを投稿（URL付き投稿はX APIの料金が高い）
    blog_link: profile
    # 数値を取得する期間（日）。長いほどX APIの読み取り料金がかかる
    metrics_days: 14
  instagram:
    # 曜日ごとの投稿形式（mon..sun）。carousel / reel / none
    weekly:
      mon: carousel
      tue: reel
      wed: carousel
      thu: reel
      fri: carousel
      sat: reel
      sun: none
    time: "20:00"

# 広告・コンプライアンス（ステマ規制対応）
compliance:
  pr_label_x: "【PR】"          # アフィリエイトを含む投稿の先頭に付ける
  pr_hashtag_instagram: "#PR"
  # AIに使わせない表現
  ng_words:
    - 絶対に儲かる
    - 必ず儲かる
    - 誰でも審査に通る
    - 審査なし
    - ブラックでも
    - リボ払いがおすすめ
    - 100%
    - 現金化
    - 即日融資
  disclaimer: "※条件・特典は変更される場合があります。最新情報は公式サイトをご確認ください。"

# Instagram画像のデザイン
design:
  brand_color: "#19448E"     # ブログと同じ紺
  accent_color: "#F5A623"    # アクセント（ゴールド）
  background: "#F7F4EE"      # 背景（オフホワイト）
  text_color: "#1F2328"
  handle_x: "@Mr_NoR_"
  handle_instagram: "@mr_nor_8"
  # アカウント名は画像・動画に一切入れない（Rさんの方針 2026-11-23）

# 非公開にする情報（台本・画像・動画のすべてで使わない）
privacy:
  # 使わない素材（GoogleドライブのファイルID）
  blocked_material_ids:
    - "1jIENWbdat-ypeKirdER1DhT-kE-vZUW8"   # ANAアプリの会員画面（マイル残高が写っている）
  # 説明にこれらを含む素材も使わない（アプリ画面・残高のスクショ）
  blocked_material_keywords: ["マイル残高", "保有マイル", "残高", "アプリ画面", "アプリのスクリーンショット", "会員画面", "マイページ"]
  # 本文に出たら投稿しない（自分の残高の表記）
  forbidden_patterns:
    - "保有\\s*[\\d,，万]+\\s*マイル"
    - "[\\d,，]+\\s*マイル\\s*(を)?保有"
    - "(保有|残高|手持ち)[^。\\n]{0,12}マイル[^。\\n]{0,6}[\\d,，]+"
    - "309,?342"
    - "30万マイル"
    - "(保有|残高|手持ち)[^。\\n]{0,12}[\\d,，]+\\s*万?\\s*マイル"
    - "SKY\\s*コイン[^。\\n]{0,8}[\\d,，]+"
    - "149,?000\\s*コイン"

# Instagram用の画像・動画をどこに置くか（Instagram APIは公開URLが必要）
#   github_raw : このリポジトリ（Public）の raw URL を使う
#   r2         : Cloudflare R2 / S3互換ストレージにアップロード（Privateリポジトリ向け）
media_host: github_raw

