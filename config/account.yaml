# ===== アカウント設定 =====
# ここを書き換えるとAIの台本・投稿スケジュールが変わります。

account:
  name: "R｜クレカ×マイル×旅"            # 表示名（変更OK）
  niche: "クレジットカード・ANAマイル・ホテル系アメックス・空港ラウンジで、旅行をお得に快適にする情報"
  target: "20〜40代の会社員・経営者。旅行が好きで、クレカやマイルをもっと上手に使いたい人。SFCやプレミアムカードに興味がある人"
  persona: |
    R（アール）。首都圏在住、会社経営、投資歴10年以上。
    2024年にSFC修行でANAダイヤモンド達成、2025年もダイヤ継続、2026年は3年目のダイヤ修行中。
    メインカードは SFC ANAダイナースプレミアム、Marriott Bonvoyアメックス・プレミアム、ヒルトン・オナーズ アメックス・プレミアム。
    ビジネスカードは ANAダイナース ビジネスアカウント、アメックスゴールドビジネス。
    趣味は旅行（宮古島が大好き）、筋トレ、ゴルフ。顔出しはしない。
    実績（2026-11-21 ANAアプリで確認）: ANAマイレージクラブ ダイヤモンド会員、保有 309,342マイル、ANA SKY コイン 149,000コイン。
    文体: 「結論から書きます」型。公式情報を根拠に、数字で淡々と、誇張しない。
    改悪・値上げも隠さず伝え、「使うべき人・待つべき人」をはっきり分ける。
    実体験（SFC修行、ダイヤ修行、ホテルステイ、ラウンジ）を混ぜて信頼感を出す。
  themes:
    クレカ比較・選び方（実際に持っているカード中心）: 25
    ANAマイル・SFC・ダイヤ修行: 25
    最新の改悪・値上げ・キャンペーン速報: 20
    ホテル（マリオット・ヒルトン）と旅行記: 15
    空港ラウンジ・ポイ活・交換ルート: 15

# メインブログ（SNSからの送客先）
blog:
  url: "https://cc-lifeblog.com/"
  # 毎日の台本のうち、ブログ記事への誘導を入れる割合（0〜1）
  promote_ratio: 0.5
  # SNSでは扱わないブログカテゴリ（アカウント凍結・規約リスクのため）
  exclude_keywords: ["現金化", "キャッシング", "カードローン", "消費者金融", "借入", "即日融資", "任意整理", "過払い", "資金調達", "在籍確認", "審査に落ち", "収入証明", "セントラル"]

# 承認モード
#   manual : 毎日AIが下書きをPull Requestで作成 → 内容を確認してマージした投稿だけ公開
#   auto   : 確認なしで自動公開（品質が安定してから切り替え推奨）
approval: manual

# Claudeの設定
llm:
  model: claude-opus-5-5
  effort: high          # low / medium / high / xhigh / max
  web_search_max_uses: 8

# 投稿スケジュール（日本時間）
schedule:
  timezone: Asia/Tokyo
  x:
    slots: ["07:30", "12:15", "18:30", "21:30"]   # 1日4投稿
    # X Premium契約中なら true（長文投稿が可能になる）
    premium: false
  instagram:
    # 曜日ごとの投稿形式（mon..sun）。carousel / reel / none
    weekly:
      mon: carousel
      tue: reel
      wed: carousel
      thu: reel
      fri: carousel
      sat: reel
      sun: none
    time: "20:00"

# 広告・コンプライアンス（ステマ規制対応）
compliance:
  pr_label_x: "【PR】"          # アフィリエイトを含む投稿の先頭に付ける
  pr_hashtag_instagram: "#PR"
  # AIに使わせない表現
  ng_words:
    - 絶対に儲かる
    - 必ず儲かる
    - 誰でも審査に通る
    - 審査なし
    - ブラックでも
    - リボ払いがおすすめ
    - 100%
    - 現金化
    - 即日融資
  disclaimer: "※条件・特典は変更される場合があります。最新情報は公式サイトをご確認ください。"

# Instagram画像のデザイン
design:
  brand_color: "#19448E"     # ブログと同じ紺
  accent_color: "#F5A623"    # アクセント（ゴールド）
  background: "#F7F4EE"      # 背景（オフホワイト）
  text_color: "#1F2328"
  handle_x: "@Mr_NoR_"
  handle_instagram: "@mr_nor_8"
  handle: "@mr_nor_8"        # 画像の隅に入れる名前（インスタ用画像なのでインスタのID）

# Instagram用の画像・動画をどこに置くか（Instagram APIは公開URLが必要）
#   github_raw : このリポジトリ（Public）の raw URL を使う
#   r2         : Cloudflare R2 / S3互換ストレージにアップロード（Privateリポジトリ向け）
media_host: github_raw

# Googleドライブ（素材の受け取りとレポート）
google:
  shared_drive_id: "0ACBytRwz_j9oUk9PVA"                 # 共有ドライブ「SNS収益化」
  materials_folder_id: "16SMq3ULP3jznmnrDO3EnGwui185CElsu" # 素材フォルダ
  report_spreadsheet_id: "1byhQedKz748HfNos3DQEqNNjnLJi0Ua13d2v4tlboVs"  # SNS運用レポート
