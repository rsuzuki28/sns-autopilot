name: 5. リクエストからリールを作る（確認用）
on:
  push:
    branches: [main]
    paths: ["requests/reel.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
      - run: pip install -r requirements.txt
      - name: リールを作って共有ドライブ（非公開）にプレビューを置く
        run: set -o pipefail; python -m autopilot reel requests/reel.json 2>&1 | tee run.log
      - name: ログを共有ドライブへ
        if: always()
        run: python -m autopilot upload-log run.log reel.log || true
