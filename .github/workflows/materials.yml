name: 4. 素材の取り込み
on:
  push:
    branches: [main]
    paths: [".github/run-now/materials"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materials:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: src
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
      - run: pip install -r requirements.txt
      - name: 素材を取り込む（説明は共有ドライブに保存）
        run: set -o pipefail; python -m autopilot sync-materials 2>&1 | tee run.log
      - name: ログを共有ドライブへ
        if: always()
        run: python -m autopilot upload-log run.log materials.log || true
